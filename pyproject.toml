[project]
name = "xams-sc"
version = "0.1.0"
description = "XAMS slow control — acquisition, storage, alarming"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.0",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# Hardware drivers. Not needed for milestone 1 (simulation only), and not
# installable on a machine without the NI runtime — hence a separate extra.
hardware = [
    "nidaqmx>=1.0",
    "pyserial>=3.5",
    "lakeshore>=1.7",
    "pywinusb>=0.4",     # APC UPS over HID (§7.4)
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Required to read the flow-reset form (§7.5). NOT optional despite
    # looking like it: FastAPI raises at import time on a Form parameter
    # when this is absent, so the web UI would not start at all.
    "python-multipart>=0.0.9",
    # Every page is a Jinja template, and `Jinja2Templates` raises at import
    # time without this. FastAPI does NOT depend on it, so it was only ever
    # present by accident: mkdocs pulls it in, so any machine that had built
    # the manual had a working web UI and any machine that had not did not.
    # A fresh `pip install -e .[api]` produced a UI that died on startup.
    "jinja2>=3.1",
]
# Alarm delivery. The same gateway the LabVIEW system uses, so the numbers,
# the message format and the costs are already known (§11).
notify = [
    "messagebird>=2.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",       # fastapi.testclient, for the web UI tests
    # The suite imports the CAEN and Lake Shore services, and both import
    # `serial` at module level, so the tests do not collect without it. It is
    # in `hardware` too, but that extra also pulls nidaqmx and pywinusb, which
    # a laptop cannot install — and running the tests must not require the
    # hardware stack. Same constraint as `hardware`, so a machine with both
    # resolves to one pyserial.
    "pyserial>=3.5",
    # Undefined-name checking. A module that imports is not a module whose
    # functions can run, and a NameError in an unexercised branch is invisible
    # until somebody in the lab runs the command. See tests/test_no_undefined_names.py.
    "pyflakes>=3.2",
]
# Documentation site (mkdocs.yml). Pure Python, no Node and no compiler, so it
# installs identically on the lab PC and on a laptop. pyserial and fastapi are
# here because mkdocstrings imports each module to read its docstrings, and
# caen.py, lakeshore.py and api/app.py import them at module level; nidaqmx and
# pywinusb are NOT needed, because those imports are inside functions.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-gen-files>=0.5",
    "pyserial>=3.5",
    "fastapi>=0.110",
]

[project.scripts]
xams-ctl = "xams_sc.cli.xams_ctl:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
