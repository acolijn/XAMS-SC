# Template. Copy to config/secrets.yaml and fill in.
#
# config/secrets.yaml is in .gitignore and must NEVER be committed: a key in
# git history remains there after deletion, and private repositories are still
# cloned, shared and backed up (§11).

sms:
  # MessageBird, the same gateway the LabVIEW system uses. The existing script
  # in SC_software\send_sms_python\ had this key hardcoded in plaintext, in
  # three copies, on the Desktop. It belongs here instead - this file is in
  # .gitignore and must never be committed (DESIGN.md section 11).
  #
  # That key has sat on a desktop for years. Rotating it is worth doing.
  provider: "messagebird"
  api_key: ""
  sender: "XAMS"         # the sender id that appears on the phone

email:
  smtp_host: ""
  smtp_port: 587
  username: ""
  password: ""
  from_address: ""

postgres:
  host: "127.0.0.1"
  port: 5432
  database: "xams"
  user: "xams"
  password: ""

# Read-only (Viewer) service account, used to notice when the dashboards in
# Grafana have drifted from grafana/dashboards-archive/, and as the base
# address for the "open in Grafana" links in the web UI (footer, alarms,
# and the P&ID mimic history popup, DESIGN.md §8.2a). It cannot edit or
# delete anything: saving and loading dashboards still takes the admin
# password, deliberately, because those write.
grafana:
  url: "http://127.0.0.1:3000"
  token: ""

